<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD · POSN PHYSICS ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F2E7; --paper2:#FDFAF3; --card:#fff;
  --ink:#2b2417; --ink2:#5c4f38; --dim:#8a7c62;
  --track:#C85A3C; --track2:#E8794F;
  --gold:#D4A017; --goldL:#F7D46B; --silver:#8E9BAA; --silverL:#CBD5E0;
  --bronze:#A9683A; --bronzeL:#D89C6A; --honor:#6B7F8E;
  --wave:#1E6091; --green:#0d8a63; --line:#e2d8c3; --line2:#d3c6ab;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun',sans-serif; color:var(--ink); min-height:100vh; padding:24px 16px 60px;
  background:
    radial-gradient(ellipse 900px 500px at 50% -8%, rgba(200,90,60,.12), transparent 62%),
    radial-gradient(ellipse 700px 450px at 105% 30%, rgba(212,160,23,.13), transparent 58%),
    radial-gradient(ellipse 600px 420px at -5% 75%, rgba(30,96,145,.09), transparent 60%),
    var(--paper);
  overflow-x:hidden; position:relative}
body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.45;
  background-image:linear-gradient(rgba(30,96,145,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(30,96,145,.05) 1px,transparent 1px);
  background-size:28px 28px}
/* running track arcs */
.trackbg{position:fixed; z-index:0; pointer-events:none; opacity:.35}
.tb1{top:-160px; left:50%; transform:translateX(-50%); width:1100px}
.tb2{bottom:-200px; right:-180px; width:520px; opacity:.25}
.wrap{position:relative; z-index:2; max-width:1000px; margin:0 auto}

/* header */
.hdr{text-align:center; margin-bottom:26px}
.badge{display:inline-flex; align-items:center; gap:8px; font-family:'Orbitron'; font-weight:700;
  font-size:11px; letter-spacing:.24em; color:var(--track); background:#fff; border:1.5px solid var(--line2);
  padding:6px 16px; border-radius:100px; text-transform:uppercase; box-shadow:0 2px 10px rgba(120,95,40,.08)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--track2);
  box-shadow:0 0 8px var(--track2); animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.hdr h1{font-family:'Orbitron'; font-weight:900; font-size:36px; margin-top:14px; letter-spacing:-.01em;
  background:linear-gradient(110deg,var(--track) 5%,var(--gold) 55%,var(--wave) 110%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.hdr .sub{color:var(--dim); font-size:14px; margin-top:5px; font-family:'Prompt'}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px}
.kpi{background:var(--card); border:1.5px solid var(--line); border-radius:15px; padding:16px 12px;
  text-align:center; box-shadow:0 5px 18px rgba(120,95,40,.07)}
.kpi .n{font-family:'Orbitron'; font-weight:800; font-size:27px; line-height:1}
.kpi .l{font-size:12px; color:var(--dim); margin-top:5px; font-family:'Prompt'}
.kpi.g .n{color:var(--gold)} .kpi.s .n{color:var(--silver)}
.kpi.b .n{color:var(--bronze)} .kpi.h .n{color:var(--honor)}

.sectitle{font-family:'Prompt'; font-weight:800; font-size:20px; color:var(--ink);
  margin:34px 0 16px; display:flex; align-items:center; gap:11px}
.sectitle::before{content:""; width:5px; height:22px; border-radius:4px;
  background:linear-gradient(180deg,var(--track2),var(--gold))}
.sectitle .tag{font-family:'Orbitron'; font-size:11px; font-weight:700; color:var(--dim);
  letter-spacing:.16em; margin-left:auto}

/* ===== PODIUM ===== */
.arena{background:linear-gradient(180deg,#fffdf8,#f8f2e4); border:1.5px solid var(--line);
  border-radius:20px; padding:28px 18px 0; box-shadow:0 10px 34px rgba(120,95,40,.10); overflow:hidden;
  position:relative}
.arena::after{content:""; position:absolute; left:0; right:0; bottom:0; height:64px;
  background:repeating-linear-gradient(90deg,#C85A3C 0 46px,#E8794F 46px 92px); opacity:.16}
.podium{display:flex; align-items:flex-end; justify-content:center; gap:14px; position:relative; z-index:2;
  min-height:320px; padding-bottom:0; flex-wrap:nowrap}
.pod{display:flex; flex-direction:column; align-items:center; flex:0 0 auto; width:150px}
.pod .runner{margin-bottom:6px; animation:hop 2.4s ease-in-out infinite}
.pod:nth-child(1) .runner{animation-delay:.1s}
.pod:nth-child(3) .runner{animation-delay:.3s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pod .gname{font-family:'Orbitron'; font-weight:800; font-size:19px; margin-bottom:2px}
.pod .gscore{font-family:'Orbitron'; font-weight:700; font-size:14px; color:var(--ink2)}
.pod .gmeta{font-size:11.5px; color:var(--dim); margin-bottom:9px}
.block{width:100%; border-radius:12px 12px 0 0; display:flex; align-items:flex-start; justify-content:center;
  padding-top:14px; font-family:'Orbitron'; font-weight:900; font-size:38px; color:rgba(255,255,255,.95);
  text-shadow:0 2px 6px rgba(0,0,0,.22); position:relative; overflow:hidden;
  animation:rise .8s cubic-bezier(.2,1.1,.4,1) both}
.block::before{content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%)}
@keyframes rise{from{transform:scaleY(.1); transform-origin:bottom; opacity:0}to{transform:none;opacity:1}}
.b1{height:150px; background:linear-gradient(160deg,var(--goldL),var(--gold)); animation-delay:.35s;
  box-shadow:0 -6px 26px rgba(212,160,23,.4)}
.b2{height:112px; background:linear-gradient(160deg,var(--silverL),var(--silver)); animation-delay:.15s}
.b3{height:86px;  background:linear-gradient(160deg,var(--bronzeL),var(--bronze)); animation-delay:.25s}

/* ผู้เข้าร่วมที่เหลือ ยืนข้างแท่น */
.sideline{display:flex; align-items:flex-end; justify-content:center; gap:16px; flex-wrap:wrap;
  padding:20px 10px 26px; position:relative; z-index:2; border-top:2px dashed var(--line2); margin-top:0}
.side{display:flex; flex-direction:column; align-items:center; width:88px; opacity:.95}
.side .runner{animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.side .sname{font-family:'Orbitron'; font-weight:700; font-size:14px; margin-top:4px; color:var(--ink2)}
.side .sscore{font-size:11.5px; color:var(--dim)}
.side .srank{font-family:'Orbitron'; font-size:10px; font-weight:700; color:#fff; background:var(--honor);
  padding:2px 8px; border-radius:100px; margin-top:4px}

/* ===== ตารางอันดับรายบุคคล ===== */
.lane{display:flex; align-items:center; gap:13px; background:var(--card); border:1.5px solid var(--line);
  border-radius:14px; padding:13px 16px; margin-bottom:9px; position:relative; overflow:hidden;
  transition:.16s; animation:slideL .45s both}
@keyframes slideL{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.lane:hover{transform:translateX(4px); box-shadow:0 6px 20px rgba(120,95,40,.13)}
.lane::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px}
.lane.gold::before{background:linear-gradient(180deg,var(--goldL),var(--gold))}
.lane.silver::before{background:linear-gradient(180deg,var(--silverL),var(--silver))}
.lane.bronze::before{background:linear-gradient(180deg,var(--bronzeL),var(--bronze))}
.lane.honor::before{background:var(--honor)}
.rk{font-family:'Orbitron'; font-weight:800; font-size:16px; color:var(--dim); min-width:34px; text-align:center}
.rk.top{color:var(--track)}
.medal{width:38px;height:38px;flex-shrink:0}
.who{flex:1; min-width:0}
.who .nm{font-family:'Prompt'; font-weight:700; font-size:16px; line-height:1.3;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who .mt{font-size:11.5px; color:var(--dim); font-family:'JetBrains Mono'}
.gchip{font-family:'Orbitron'; font-weight:700; font-size:11px; background:#f0ebdc; color:var(--ink2);
  padding:3px 9px; border-radius:100px; border:1px solid var(--line2)}
.prbox{text-align:right; min-width:96px}
.pr{font-family:'Orbitron'; font-weight:800; font-size:20px; line-height:1}
.pr.gold{color:var(--gold)} .pr.silver{color:var(--silver)}
.pr.bronze{color:var(--bronze)} .pr.honor{color:var(--honor)}
.prl{font-size:10.5px; color:var(--dim); font-family:'Prompt'}
.prbar{height:6px; background:#ece4d3; border-radius:100px; margin-top:5px; overflow:hidden; width:100%}
.prfill{height:100%; border-radius:100px; width:0; transition:width 1s cubic-bezier(.2,1,.4,1)}
.prfill.gold{background:linear-gradient(90deg,var(--goldL),var(--gold))}
.prfill.silver{background:linear-gradient(90deg,var(--silverL),var(--silver))}
.prfill.bronze{background:linear-gradient(90deg,var(--bronzeL),var(--bronze))}
.prfill.honor{background:var(--honor)}

.legend{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; font-size:12.5px}
.lg{display:flex; align-items:center; gap:7px; background:#fff; border:1.5px solid var(--line);
  border-radius:100px; padding:6px 14px; font-family:'Prompt'; font-weight:600}
.lg i{width:11px;height:11px;border-radius:50%; display:inline-block}
.lg.gold i{background:var(--gold)} .lg.silver i{background:var(--silver)}
.lg.bronze i{background:var(--bronze)} .lg.honor i{background:var(--honor)}

.ctrl{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center}
.sel{background:#fff; border:1.5px solid var(--line2); border-radius:10px; padding:10px 14px;
  font-family:'Sarabun'; font-size:14px; color:var(--ink); outline:none; cursor:pointer}
.sel:focus{border-color:var(--track2)}
.btn{border:none; cursor:pointer; font-family:'Prompt'; font-weight:700; font-size:14px; color:#fff;
  background:linear-gradient(120deg,var(--track),var(--track2)); padding:10px 20px; border-radius:10px;
  box-shadow:0 5px 16px rgba(200,90,60,.25); transition:.15s}
.btn:hover{transform:translateY(-1px)}
.msg{padding:13px 16px; border-radius:11px; font-size:13.5px; margin-bottom:16px; display:none}
.msg.show{display:block}
.msg.warn{background:#fdf3e0; border:1.5px solid #f0d49a; color:#8a6210}
.msg.err{background:#fdeeea; border:1.5px solid #f2c0b3; color:#a63a22}
.empty{text-align:center; padding:40px 20px; color:var(--dim); font-size:14.5px}
@media(max-width:640px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hdr h1{font-size:26px}
  .pod{width:104px} .podium{gap:8px; min-height:280px}
  .block{font-size:30px} .b1{height:126px} .b2{height:96px} .b3{height:74px}
  .pod .gname{font-size:15px}
  .side{width:74px}
  .prbox{min-width:76px} .pr{font-size:17px}
}
</style>
</head>
<body>

<svg class="trackbg tb1" viewBox="0 0 1100 300" fill="none">
  <ellipse cx="550" cy="150" rx="520" ry="130" stroke="#C85A3C" stroke-width="2"/>
  <ellipse cx="550" cy="150" rx="470" ry="112" stroke="#E8794F" stroke-width="1.5"/>
  <ellipse cx="550" cy="150" rx="420" ry="94" stroke="#D4A017" stroke-width="1.5"/>
  <ellipse cx="550" cy="150" rx="370" ry="76" stroke="#1E6091" stroke-width="1.2"/>
</svg>
<svg class="trackbg tb2" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="88" stroke="#C85A3C" stroke-width="1.6" stroke-dasharray="9 7"/>
  <circle cx="100" cy="100" r="64" stroke="#D4A017" stroke-width="1.4"/>
</svg>

<div class="wrap">
  <div class="hdr">
    <div class="badge"><span class="dot"></span> POSN PHYSICS ARENA</div>
    <h1>PHYSICS CHAMPIONSHIP</h1>
    <div class="sub">กระดานอันดับผู้เล่นและกลุ่ม · ฟิสิกส์ สอวน. ค่าย 1</div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="ctrl">
    <select class="sel" id="modSel"><option value="ALL">ทุกโมดูลรวมกัน</option></select>
    <button class="btn" id="btnReload">↻ โหลดข้อมูลใหม่</button>
  </div>

  <div class="kpis">
    <div class="kpi g"><div class="n" id="kGold">0</div><div class="l">🥇 เหรียญทอง</div></div>
    <div class="kpi s"><div class="n" id="kSilver">0</div><div class="l">🥈 เหรียญเงิน</div></div>
    <div class="kpi b"><div class="n" id="kBronze">0</div><div class="l">🥉 เหรียญทองแดง</div></div>
    <div class="kpi h"><div class="n" id="kHonor">0</div><div class="l">🎖 ชมเชย</div></div>
  </div>

  <div class="sectitle">แท่นรับรางวัล — อันดับกลุ่ม <span class="tag" id="tagMod">ALL MODULES</span></div>
  <div class="arena">
    <div class="podium" id="podium"></div>
    <div class="sideline" id="sideline"></div>
  </div>

  <div class="sectitle">อันดับรายบุคคล <span class="tag">INDIVIDUAL RANKING</span></div>
  <div class="legend">
    <div class="lg gold"><i></i>ทอง · PR &gt; 85%</div>
    <div class="lg silver"><i></i>เงิน · PR &gt; 70%</div>
    <div class="lg bronze"><i></i>ทองแดง · PR &gt; 55%</div>
    <div class="lg honor"><i></i>ชมเชย · PR ≤ 55%</div>
  </div>
  <div id="ranking"></div>
</div>

<script>
/* ================= ตั้งค่า ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxfpSJ0CZIGI8vNbs9zw34_OsjEgNoIYxgQ0wuDHsGfEwFb5ieZb2F5FHaijzaNwVG4OQ/exec";
const PER_MODULE = 15;                     // คะแนนเต็มต่อโมดูล
const TIER = [                             // เกณฑ์เหรียญตาม PR (%)
  { min:85, key:"gold",   name:"เหรียญทอง",     emoji:"🥇" },
  { min:70, key:"silver", name:"เหรียญเงิน",    emoji:"🥈" },
  { min:55, key:"bronze", name:"เหรียญทองแดง", emoji:"🥉" },
  { min:0,  key:"honor",  name:"ชมเชย",         emoji:"🎖" }
];
const tierOf = pr => TIER.find(t=>pr>=t.min) || TIER[TIER.length-1];

const $ = id=>document.getElementById(id);
let DATA = null, CURMOD = "ALL";

/* ================= ข้อมูลตัวอย่าง (ใช้เมื่อยังไม่ตั้ง API_URL) ================= */
const DEMO = {
  status:"ok", perModule:15,
  modules:["โมดูล 1","โมดูล 2","โมดูล 3","โมดูล 7"],
  players:[
    {sid:"06755",group:"A",alias:"ไอน์สไตน์น้อย",scores:{"โมดูล 1":15,"โมดูล 2":14,"โมดูล 3":13,"โมดูล 7":14}},
    {sid:"06712",group:"B",alias:"นิวตันจูเนียร์",scores:{"โมดูล 1":14,"โมดูล 2":13,"โมดูล 3":14}},
    {sid:"06798",group:"A",alias:"ฟ้าใส",scores:{"โมดูล 1":13,"โมดูล 2":12,"โมดูล 3":12,"โมดูล 7":13}},
    {sid:"06733",group:"C",alias:"แม็กซ์เวลล์",scores:{"โมดูล 1":12,"โมดูล 2":13,"โมดูล 3":11}},
    {sid:"06701",group:"B",alias:"กาลิเลโอ",scores:{"โมดูล 1":11,"โมดูล 2":12,"โมดูล 7":12}},
    {sid:"06744",group:"D",alias:"เทสลา",scores:{"โมดูล 1":12,"โมดูล 3":10,"โมดูล 7":11}},
    {sid:"06766",group:"C",alias:"คูลอมบ์",scores:{"โมดูล 1":10,"โมดูล 2":11,"โมดูล 3":10}},
    {sid:"06777",group:"A",alias:"โบร์",scores:{"โมดูล 1":11,"โมดูล 2":10,"โมดูล 7":10}},
    {sid:"06788",group:"E",alias:"แฟราเดย์",scores:{"โมดูล 1":9,"โมดูล 2":10,"โมดูล 3":9}},
    {sid:"06722",group:"D",alias:"เคปเลอร์",scores:{"โมดูล 1":9,"โมดูล 3":8,"โมดูล 7":10}},
    {sid:"06711",group:"B",alias:"ปาสคาล",scores:{"โมดูล 1":8,"โมดูล 2":9}},
    {sid:"06799",group:"E",alias:"อาร์คิมิดีส",scores:{"โมดูล 2":8,"โมดูล 3":7}},
    {sid:"06755b",group:"C",alias:"เฮิรตซ์",scores:{"โมดูล 1":7,"โมดูล 2":8,"โมดูล 7":7}},
    {sid:"06723",group:"D",alias:"ดอปเพลอร์",scores:{"โมดูล 1":6,"โมดูล 3":7}},
    {sid:"06734",group:"E",alias:"โอห์ม",scores:{"โมดูล 1":5,"โมดูล 2":6,"โมดูล 3":6}}
  ]
};

/* ================= รูปนักวิ่ง SVG ================= */
function runnerSVG(size, tone, num){
  const C = { gold:{b:"#D4A017",l:"#F7D46B"}, silver:{b:"#8E9BAA",l:"#CBD5E0"},
              bronze:{b:"#A9683A",l:"#D89C6A"}, honor:{b:"#6B7F8E",l:"#9DB0BE"} }[tone];
  return `<svg class="runner" width="${size}" height="${size*1.15}" viewBox="0 0 60 70" fill="none">
    <ellipse cx="30" cy="66" rx="15" ry="3.4" fill="rgba(0,0,0,.13)"/>
    <circle cx="30" cy="12" r="8.5" fill="${C.l}" stroke="${C.b}" stroke-width="2"/>
    <path d="M30 21 q-8 3 -8 13 l0 10 q0 3 3 3 l10 0 q3 0 3 -3 l0 -10 q0 -10 -8 -13 z" fill="${C.b}"/>
    <text x="30" y="38" text-anchor="middle" fill="#fff" font-family="Orbitron" font-weight="900" font-size="11">${num||""}</text>
    <path d="M23 25 l-8 10" stroke="${C.b}" stroke-width="4" stroke-linecap="round"/>
    <path d="M37 25 l9 -7" stroke="${C.b}" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 47 l-4 15" stroke="${C.b}" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M34 47 l5 15" stroke="${C.b}" stroke-width="4.5" stroke-linecap="round"/>
  </svg>`;
}
function medalSVG(tone){
  const C = { gold:{b:"#D4A017",l:"#F7D46B",r:"#C85A3C"}, silver:{b:"#8E9BAA",l:"#CBD5E0",r:"#1E6091"},
              bronze:{b:"#A9683A",l:"#D89C6A",r:"#7a4a20"}, honor:{b:"#6B7F8E",l:"#9DB0BE",r:"#4a5a66"} }[tone];
  return `<svg class="medal" viewBox="0 0 40 40" fill="none">
    <path d="M13 3 L20 18 L27 3" stroke="${C.r}" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="26" r="11.5" fill="${C.l}" stroke="${C.b}" stroke-width="2.4"/>
    <circle cx="20" cy="26" r="7" fill="none" stroke="${C.b}" stroke-width="1.4" opacity=".65"/>
    <path d="M20 21.5 l1.5 3.2 l3.5 .4 l-2.6 2.4 .7 3.5 l-3.1 -1.7 l-3.1 1.7 .7 -3.5 l-2.6 -2.4 3.5 -.4 z" fill="${C.b}"/>
  </svg>`;
}

/* ================= คำนวณ ================= */
function calc(players, modKey){
  return players.map(p=>{
    let total=0, done=0;
    if(modKey==="ALL"){
      for(const k in p.scores){ total+=p.scores[k]; done++; }
    }else{
      if(p.scores[modKey]!=null){ total=p.scores[modKey]; done=1; }
    }
    const max = done*PER_MODULE;
    const pr  = max>0 ? (total/max*100) : 0;
    return {...p, total, done, max, pr, tier:tierOf(pr)};
  }).filter(p=>p.done>0).sort((a,b)=> b.pr-a.pr || b.total-a.total);
}
function groupStat(list){
  const g={};
  list.forEach(p=>{
    const k=p.group||"—";
    if(!g[k]) g[k]={group:k,sum:0,n:0,members:0};
    g[k].sum+=p.pr; g[k].n++; g[k].members++;
  });
  return Object.values(g).map(x=>({...x, avg:x.sum/x.n})).sort((a,b)=>b.avg-a.avg);
}

/* ================= แสดงผล ================= */
function render(){
  const list = calc(DATA.players, CURMOD);
  const groups = groupStat(list);
  $("tagMod").textContent = (CURMOD==="ALL"?"ALL MODULES":CURMOD.toUpperCase());

  // KPI
  const cnt={gold:0,silver:0,bronze:0,honor:0};
  list.forEach(p=>cnt[p.tier.key]++);
  $("kGold").textContent=cnt.gold; $("kSilver").textContent=cnt.silver;
  $("kBronze").textContent=cnt.bronze; $("kHonor").textContent=cnt.honor;

  // แท่นรับรางวัล (3 อันดับแรก เรียง 2-1-3)
  const pod=$("podium"); pod.innerHTML="";
  if(groups.length===0){ pod.innerHTML='<div class="empty">ยังไม่มีข้อมูลคะแนน</div>'; }
  const order=[1,0,2], blk=["b2","b1","b3"], tone=["silver","gold","bronze"], rk=["2","1","3"];
  order.forEach((gi,slot)=>{
    const g=groups[gi]; if(!g) return;
    const d=document.createElement("div"); d.className="pod";
    d.innerHTML = runnerSVG(slot===1?62:52, tone[slot], g.group) +
      '<div class="gname" style="color:var(--'+tone[slot]+')">กลุ่ม '+g.group+'</div>'+
      '<div class="gscore">'+g.avg.toFixed(1)+'%</div>'+
      '<div class="gmeta">'+g.members+' คน</div>'+
      '<div class="block '+blk[slot]+'">'+rk[slot]+'</div>';
    pod.appendChild(d);
  });

  // กลุ่มที่เหลือ ยืนข้างแท่น
  const side=$("sideline"); side.innerHTML="";
  const rest=groups.slice(3);
  if(rest.length===0){ side.style.display="none"; }
  else{
    side.style.display="flex";
    rest.forEach((g,i)=>{
      const d=document.createElement("div"); d.className="side";
      d.innerHTML = runnerSVG(40,"honor",g.group) +
        '<div class="sname">กลุ่ม '+g.group+'</div>'+
        '<div class="sscore">'+g.avg.toFixed(1)+'% · '+g.members+' คน</div>'+
        '<div class="srank">อันดับ '+(i+4)+'</div>';
      side.appendChild(d);
    });
  }

  // อันดับรายบุคคล
  const rank=$("ranking"); rank.innerHTML="";
  if(list.length===0){ rank.innerHTML='<div class="empty">ยังไม่มีผู้เล่นทำแบบทดสอบในโมดูลนี้</div>'; return; }
  list.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="lane "+p.tier.key; d.style.animationDelay=(i*0.035)+"s";
    d.innerHTML=
      '<div class="rk'+(i<3?' top':'')+'">'+(i+1)+'</div>'+
      medalSVG(p.tier.key)+
      '<div class="who"><div class="nm">'+p.alias+' <span class="gchip">'+p.group+'</span></div>'+
        '<div class="mt">'+p.total+'/'+p.max+' คะแนน · '+p.done+' โมดูล · '+p.tier.emoji+' '+p.tier.name+'</div></div>'+
      '<div class="prbox"><div class="pr '+p.tier.key+'">'+p.pr.toFixed(1)+'%</div>'+
        '<div class="prl">PR</div>'+
        '<div class="prbar"><div class="prfill '+p.tier.key+'" data-w="'+p.pr+'"></div></div></div>';
    rank.appendChild(d);
  });
  setTimeout(()=>document.querySelectorAll(".prfill").forEach(b=>b.style.width=b.dataset.w+"%"),120);
}

function fillModSel(){
  const s=$("modSel");
  s.innerHTML='<option value="ALL">ทุกโมดูลรวมกัน</option>';
  (DATA.modules||[]).forEach(m=>{
    const o=document.createElement("option"); o.value=m; o.textContent=m; s.appendChild(o);
  });
  s.value=CURMOD;
}

async function load(){
  const m=$("msg");
  if(API_URL.startsWith("PASTE_")){
    DATA=DEMO;
    m.className="msg show warn";
    m.innerHTML="● <b>โหมดสาธิต</b> — ยังไม่ได้ตั้งค่า API_URL จึงแสดงข้อมูลตัวอย่าง 15 คน 5 กลุ่ม (เมื่อใส่ URL แล้วจะดึงข้อมูลจริงจากชีต)";
    fillModSel(); render(); return;
  }
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"leaderboard"})});
    const r=await res.json();
    if(r.status!=="ok"){ m.className="msg show err"; m.textContent="⚠ โหลดข้อมูลไม่สำเร็จ: "+(r.message||r.status); return; }
    DATA=r; m.className="msg";
    fillModSel(); render();
  }catch(err){ m.className="msg show err"; m.textContent="⚠ เชื่อมต่อไม่สำเร็จ: "+err.message; }
}

$("modSel").addEventListener("change",e=>{ CURMOD=e.target.value; render(); });
$("btnReload").addEventListener("click", load);
load();
</script>
</body>
</html>

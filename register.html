<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลงทะเบียนผู้เล่น · POSN PHYSICS QUIZ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1626; --panel:#131c30; --panel2:#182236;
  --line:#243350; --line2:#2f4468;
  --cyan:#3BE8D0; --cyan2:#1BA3C7; --gold:#F4B740; --amber:#B67C09;
  --violet:#8B7BE8; --ink:#e8eef7; --dim:#8fa3c0; --dim2:#5f7396;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Prompt',sans-serif; color:var(--ink);
  background:
    radial-gradient(ellipse 900px 600px at 15% -10%, rgba(59,232,208,.10), transparent 60%),
    radial-gradient(ellipse 800px 500px at 110% 20%, rgba(139,123,232,.12), transparent 55%),
    radial-gradient(ellipse 700px 500px at 50% 120%, rgba(244,183,64,.08), transparent 60%),
    linear-gradient(160deg, #0a0e1a 0%, #0c1220 50%, #090d18 100%);
  min-height:100vh; overflow-x:hidden; position:relative;
  display:flex; align-items:center; justify-content:center; padding:28px 18px;
}
/* physics doodle background */
.bgfx{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5}
.bgfx svg{position:absolute}
.orbit{top:-140px; right:-120px; width:460px; height:460px; animation:spin 60s linear infinite}
.orbit2{bottom:-180px; left:-140px; width:520px; height:520px; animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.eqwater{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05;
  font-family:'JetBrains Mono',monospace; font-size:13px; line-height:2.4; color:var(--cyan);
  white-space:pre-wrap; padding:24px; overflow:hidden; letter-spacing:.5px}

.wrap{position:relative; z-index:2; width:100%; max-width:460px}

.brand{text-align:center; margin-bottom:22px}
.brand .badge{
  display:inline-flex; align-items:center; gap:9px;
  font-family:'Orbitron',sans-serif; font-weight:700; font-size:12px; letter-spacing:.28em;
  color:var(--cyan); border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(59,232,208,.08), rgba(59,232,208,.02));
  padding:7px 16px; border-radius:100px; text-transform:uppercase;
  box-shadow:0 0 30px rgba(59,232,208,.08), inset 0 0 20px rgba(59,232,208,.04);
}
.brand .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan); animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.brand h1{font-family:'Prompt'; font-weight:800; font-size:27px; margin-top:16px; letter-spacing:-.01em;
  background:linear-gradient(120deg,#fff 20%, var(--cyan) 120%); -webkit-background-clip:text;
  background-clip:text; -webkit-text-fill-color:transparent}
.brand .sub{color:var(--dim); font-size:13.5px; font-weight:400; margin-top:5px}
.brand .sub b{color:var(--gold); font-weight:600}

.card{
  background:linear-gradient(180deg, rgba(24,34,54,.92), rgba(15,22,38,.95));
  border:1px solid var(--line); border-radius:20px; padding:26px 24px 24px;
  box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
}
.card::before{content:""; display:block; height:2px; margin:-26px -24px 22px;
  border-radius:20px 20px 0 0;
  background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
  opacity:.6}

.field{margin-bottom:16px}
.field label{display:block; font-size:13px; font-weight:500; color:var(--dim); margin-bottom:7px; letter-spacing:.02em}
.field label .req{color:var(--cyan); margin-left:3px}
.field .hint{font-size:11.5px; color:var(--dim2); font-weight:300; margin-left:6px}
.inp{
  width:100%; background:var(--bg2); border:1.5px solid var(--line);
  border-radius:11px; padding:13px 15px; color:var(--ink); font-family:'Prompt'; font-size:15.5px;
  transition:.18s; outline:none;
}
.inp::placeholder{color:#4a5c78}
.inp:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(59,232,208,.12); background:#0d1424}
.inp.mono{font-family:'JetBrains Mono',monospace; letter-spacing:.08em}

/* group chips */
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  flex:1 1 auto; text-align:center; min-width:56px;
  background:var(--bg2); border:1.5px solid var(--line); border-radius:10px;
  padding:11px 6px; cursor:pointer; transition:.16s; font-weight:600; font-size:15px; color:var(--dim);
  font-family:'Orbitron',sans-serif; letter-spacing:.05em;
}
.chip:hover{border-color:var(--cyan2); color:var(--ink)}
.chip.on{border-color:var(--cyan); color:#04121a;
  background:linear-gradient(180deg,var(--cyan),var(--cyan2)); box-shadow:0 6px 18px rgba(59,232,208,.28)}

.btn{
  width:100%; margin-top:8px; border:none; cursor:pointer;
  font-family:'Prompt'; font-weight:700; font-size:16px; color:#04121a;
  background:linear-gradient(120deg, var(--cyan) 0%, #46d6b8 55%, var(--gold) 180%);
  padding:15px; border-radius:12px; letter-spacing:.02em; transition:.16s;
  box-shadow:0 10px 30px rgba(59,232,208,.25), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn:hover{transform:translateY(-1px); box-shadow:0 14px 36px rgba(59,232,208,.35)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55; cursor:not-allowed; transform:none}

.msg{margin-top:15px; padding:12px 15px; border-radius:11px; font-size:13.5px; display:none; line-height:1.5}
.msg.show{display:block; animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.msg.ok{background:rgba(59,232,208,.10); border:1px solid rgba(59,232,208,.35); color:#8ef0e2}
.msg.exist{background:rgba(244,183,64,.10); border:1px solid rgba(244,183,64,.35); color:#f6cd7a}
.msg.err{background:rgba(232,101,74,.10); border:1px solid rgba(232,101,74,.35); color:#f2a08e}
.msg b{font-weight:700}

.footer{text-align:center; margin-top:18px; font-size:11.5px; color:var(--dim2); font-family:'JetBrains Mono',monospace; letter-spacing:.05em}

.spinner{display:inline-block; width:15px;height:15px; border:2px solid rgba(4,18,26,.3);
  border-top-color:#04121a; border-radius:50%; animation:sp .6s linear infinite; vertical-align:-2px; margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="bgfx">
  <svg class="orbit" viewBox="0 0 200 200" fill="none">
    <ellipse cx="100" cy="100" rx="90" ry="38" stroke="#3BE8D0" stroke-width="0.5" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="100" rx="90" ry="38" stroke="#8B7BE8" stroke-width="0.5" transform="rotate(90 100 100)"/>
    <ellipse cx="100" cy="100" rx="90" ry="38" stroke="#F4B740" stroke-width="0.5" transform="rotate(150 100 100)"/>
    <circle cx="100" cy="100" r="6" fill="#3BE8D0"/>
  </svg>
  <svg class="orbit2" viewBox="0 0 200 200" fill="none">
    <ellipse cx="100" cy="100" rx="90" ry="30" stroke="#3BE8D0" stroke-width="0.4" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="100" rx="90" ry="30" stroke="#8B7BE8" stroke-width="0.4" transform="rotate(120 100 100)"/>
    <circle cx="190" cy="100" r="4" fill="#8B7BE8"/>
  </svg>
</div>
<div class="eqwater" id="eqwater"></div>

<div class="wrap">
  <div class="brand">
    <div class="badge"><span class="dot"></span> POSN PHYSICS · CAMP 1</div>
    <h1>ลงทะเบียนผู้เล่น</h1>
    <div class="sub">ระบบฝึกทำโจทย์ควิซ · <b>ฟิสิกส์ สอวน. ค่าย 1</b></div>
  </div>

  <div class="card">
    <div class="field">
      <label>รหัสประจำตัวนักเรียน <span class="req">*</span></label>
      <input class="inp mono" id="sid" inputmode="numeric" autocomplete="off"
             placeholder="เช่น 06755" maxlength="12">
    </div>

    <div class="field">
      <label>กลุ่ม <span class="req">*</span> <span class="hint">เลือกกลุ่มของคุณ</span></label>
      <div class="chips" id="chips">
        <div class="chip" data-g="A">A</div>
        <div class="chip" data-g="B">B</div>
        <div class="chip" data-g="C">C</div>
        <div class="chip" data-g="D">D</div>
        <div class="chip" data-g="E">E</div>
      </div>
      <input type="hidden" id="group">
    </div>

    <div class="field">
      <label>นามแฝง (ชื่อเล่น) <span class="req">*</span> <span class="hint">ใช้แสดงบนกระดาน</span></label>
      <input class="inp" id="alias" autocomplete="off" placeholder="เช่น ไอน์สไตน์น้อย" maxlength="24">
    </div>

    <button class="btn" id="submit">เข้าสู่ระบบควิซ →</button>

    <div class="msg" id="msg"></div>
  </div>

  <div class="footer">SURATPITTAYA · POSN PHYSICS TRAINING SYSTEM</div>
</div>

<script>
/* ====== ตั้งค่า endpoint (วาง URL ของ Apps Script Web App ที่ deploy แล้ว) ====== */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

/* ---- ลายน้ำสมการฟิสิกส์เป็น background ---- */
const eqs = ["F = G·m₁m₂/r²","∮E·dA = Q/ε₀","v = fλ","p = mv","F = qE","T² ∝ r³",
  "½mv² + mgh = const","ΣF = ma","P + ½ρv² + ρgy = C","n₁sinθ₁ = n₂sinθ₂",
  "a_c = v²/r","x = A·cos(ωt+φ)","E = -GMm/2r","τ = rF sinφ","1/f = 1/s + 1/s'"];
let water=""; for(let i=0;i<60;i++){ water += eqs[i%eqs.length] + "     "; if(i%4===3) water+="\n"; }
document.getElementById('eqwater').textContent = water;

/* ---- group chips ---- */
const chips = document.getElementById('chips');
const groupInput = document.getElementById('group');
chips.addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  [...chips.children].forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); groupInput.value = c.dataset.g;
});

const $ = id=>document.getElementById(id);
function showMsg(type, html){
  const m = $('msg'); m.className = 'msg show ' + type; m.innerHTML = html;
}

async function postJSON(payload){
  // ส่งเป็น text/plain เพื่อเลี่ยง CORS preflight ของ Apps Script (ฝั่ง .gs parse JSON เอง)
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return res.json();
}

$('submit').addEventListener('click', async ()=>{
  const sid = $('sid').value.trim();
  const group = groupInput.value;
  const alias = $('alias').value.trim();

  if(!sid){ showMsg('err','⚠ กรุณากรอก<b>รหัสประจำตัวนักเรียน</b>'); $('sid').focus(); return; }
  if(!group){ showMsg('err','⚠ กรุณา<b>เลือกกลุ่ม</b>'); return; }
  if(!alias){ showMsg('err','⚠ กรุณากรอก<b>นามแฝง</b>'); $('alias').focus(); return; }

  if(API_URL.startsWith('PASTE_')){
    showMsg('err','⚠ ยังไม่ได้ตั้งค่า <b>API_URL</b> — วาง URL ของ Apps Script Web App ก่อนใช้งานจริง');
    return;
  }

  const btn = $('submit');
  btn.disabled = true;
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>กำลังลงทะเบียน...';

  try{
    const r = await postJSON({ action:'register', sid, group, alias });
    if(r.status === 'registered'){
      // เก็บ session ไว้ให้หน้าควิซใช้ต่อ
      sessionStorage.setItem('posn_player', JSON.stringify({sid:r.sid, group:r.group, alias:r.alias}));
      showMsg('ok','✓ ลงทะเบียนสำเร็จ! ยินดีต้อนรับ <b>'+r.alias+'</b> (กลุ่ม '+r.group+')<br>กำลังเข้าสู่ระบบควิซ...');
      setTimeout(()=>{ window.location.href='quiz.html'; }, 1200);
    }else if(r.status === 'exists'){
      sessionStorage.setItem('posn_player', JSON.stringify({sid:r.sid, group:r.group, alias:r.alias}));
      showMsg('exist','● รหัสนี้ลงทะเบียนไว้แล้วในชื่อ <b>'+r.alias+'</b> (กลุ่ม '+r.group+')<br>เข้าสู่ระบบด้วยข้อมูลเดิม...');
      setTimeout(()=>{ window.location.href='quiz.html'; }, 1200);
    }else{
      showMsg('err','⚠ '+(r.message||'เกิดข้อผิดพลาด กรุณาลองใหม่'));
      btn.disabled=false; btn.innerHTML=orig;
    }
  }catch(err){
    showMsg('err','⚠ เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: '+err.message);
    btn.disabled=false; btn.innerHTML=orig;
  }
});

// Enter เพื่อส่ง
['sid','alias'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') $('submit').click(); }));
</script>
</body>
</html>
